name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须放在 setup-gradle 之前：该 action 会执行 ./gradlew --version 探测版本，
      # 而 git 在 Windows 上提交时不会记录可执行位，checkout 出来是 644，会 Permission denied
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 同样必须放在 setup-gradle 之前：它会读取 wrapper 的 distributionUrl 预取发行版，
      # 腾讯镜像在国外 runner 上不可靠，先换成 Gradle 官方源
      - name: Use official Gradle distribution on CI
        run: |
          sed -i \
            -e 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' \
            -e 's|validateDistributionUrl=true|validateDistributionUrl=false|' \
            -e 's|retries=0|retries=3|' \
            gradle/wrapper/gradle-wrapper.properties
          echo "--- 替换后的 wrapper 配置 ---"
          cat gradle/wrapper/gradle-wrapper.properties

      # 必须是 21：fabric-loom 1.17+ 要求运行 Gradle 的 JVM 至少是 21。
      # 注意这只是"跑构建的 JDK"，产物字节码仍由 options.release=17 控制，玩家侧 Java 17 即可
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar dist/*-dev.jar
          echo "--- 待发布的 jar ---"
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: endless-totem
          path: dist/*.jar
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
